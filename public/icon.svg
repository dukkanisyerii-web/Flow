<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFF66" />
      <stop offset="100%" stop-color="#B2E600" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#222B38" stroke-width="8" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="256" cy="256" r="160" fill="#D8FF4F" opacity="0.08" filter="url(#glow)" />
  
  <!-- Modern Geometric Flow Monogram 'C' / Restaurant Utensils -->
  <g transform="translate(64, 64) scale(0.75)" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Arc / Hex Flow -->
    <path d="M 384 140 C 330 60 210 50 140 120 C 70 190 70 322 140 392 C 210 462 330 452 384 372" 
          fill="none" stroke-width="42" />
    
    <!-- Center pulse dot -->
    <circle cx="256" cy="256" r="28" fill="url(#neon)" stroke="none" />
    
    <!-- Forward Flow Chevron -->
    <path d="M 280 200 L 336 256 L 280 312" fill="none" stroke-width="36" />
  </g>
</svg>
